<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halaman tidak ditemukan • SIBORU</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="images/logo-idb-transparent.png" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .err-shell {
      min-height: 100vh; display: grid; place-items: center; text-align: center;
      padding: 32px 20px; color: #fff;
      background: radial-gradient(900px 500px at 80% 10%, rgba(245, 166, 35, 0.22), transparent 60%),
                  linear-gradient(150deg, #123a6b, #071a33);
    }
    .err-card { max-width: 520px; }
    .err-code { font-size: 72px; font-weight: 800; letter-spacing: -2px; color: #f5a623; line-height: 1; }
    .err-card h1 { margin: 10px 0 8px; font-size: 26px; font-weight: 800; }
    .err-card p { color: rgba(255, 255, 255, 0.78); font-size: 14.5px; }
    .err-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  </style>
</head>
<body>
  <main class="err-shell">
    <div class="err-card">
      <div class="err-code">404</div>
      <h1>Halaman tidak ditemukan</h1>
      <p>Alamat yang Anda buka tidak tersedia di <strong>SIBORU — Sistem Booking Ruangan</strong> IDB Bali.</p>
      <div class="err-actions">
        <a class="btn btn--gold" href="catalog.html">Buka Katalog Ruangan</a>
        <a class="btn btn--outline" href="index.html">Kembali ke Login</a>
      </div>
    </div>
  </main>
</body>
</html>
