<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Ruang Kelas Magister">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/><stop offset="1" stop-color="#123a6b"/>
    </linearGradient>
    <linearGradient id="tbl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e4976"/><stop offset=".5" stop-color="#2563a8"/><stop offset="1" stop-color="#1e4976"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- partisi emas -->
  <g opacity=".5" stroke="#f5a623" stroke-width="3">
    <path d="M40 40 h180 M40 40 v120"/><path d="M760 40 h-180 M760 40 v120"/>
  </g>
  <!-- layar presentasi premium -->
  <rect x="248" y="42" width="304" height="150" rx="10" fill="#f5a623"/>
  <rect x="256" y="50" width="288" height="134" rx="6" fill="#08203f"/>
  <g stroke="#f5a623" stroke-width="7" stroke-linecap="round">
    <path d="M286 84 h130"/><path d="M286 114 h200"/><path d="M286 144 h96"/>
  </g>
  <path d="M500 132 l30 20 l-30 20 z" fill="#f5a623"/>
  <!-- meja magister panjang -->
  <rect x="120" y="238" width="560" height="96" rx="44" fill="url(#tbl)"/>
  <rect x="120" y="238" width="560" height="14" rx="7" fill="#f5a623" opacity=".8"/>
  <!-- kursi berhadapan -->
  <g fill="#0b2545" stroke="#f5a623" stroke-width="3">
    <rect x="160" y="196" width="72" height="44" rx="14"/>
    <rect x="268" y="196" width="72" height="44" rx="14"/>
    <rect x="364" y="196" width="72" height="44" rx="14"/>
    <rect x="460" y="196" width="72" height="44" rx="14"/>
    <rect x="568" y="196" width="72" height="44" rx="14"/>
  </g>
  <g fill="#0b2545" stroke="#f5a623" stroke-width="3">
    <rect x="160" y="336" width="72" height="44" rx="14"/>
    <rect x="268" y="336" width="72" height="44" rx="14"/>
    <rect x="364" y="336" width="72" height="44" rx="14"/>
    <rect x="460" y="336" width="72" height="44" rx="14"/>
    <rect x="568" y="336" width="72" height="44" rx="14"/>
  </g>
  <!-- laptop & alat tulis di meja -->
  <g>
    <rect x="200" y="258" width="70" height="42" rx="5" fill="#08203f"/>
    <rect x="206" y="264" width="58" height="30" rx="3" fill="#38bdf8"/>
    <rect x="520" y="264" width="80" height="30" rx="6" fill="#f8fafc" opacity=".9"/>
    <path d="M532 274 h56 M532 284 h40" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- lantai -->
  <rect y="418" width="800" height="32" fill="#071a33" opacity=".55"/>
  <text x="772" y="432" text-anchor="end" font-size="84" font-family="Segoe UI Emoji, 'Apple Color Emoji', sans-serif" opacity=".18">🎓</text>
</svg>
