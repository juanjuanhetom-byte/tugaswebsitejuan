  <!-- silang kursor desain -->
  <g stroke="#fff" stroke-width="3" opacity=".5" stroke-linecap="round">
    <path d="M470 150 l22 26 l-9 3 l7 16 l-7 4 l-7 -16 l-9 6 z" fill="#fff"/>
  </g>
  <text x="772" y="430" text-anchor="end" font-size="92" font-family="Segoe UI Emoji, 'Apple Color Emoji', sans-serif" opacity=".16">🖥️</text>
