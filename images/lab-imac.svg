<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Lab iMac">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="art1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/><stop offset=".55" stop-color="#ec4899"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="art3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect y="330" width="800" height="120" fill="#0b1220" opacity=".55"/>
  <rect x="40" y="330" width="720" height="12" rx="6" fill="#374151"/>
  <!-- iMac 1 -->
  <g>
    <rect x="80" y="110" width="170" height="150" rx="10" fill="#e5e7eb"/>
    <rect x="90" y="120" width="150" height="118" rx="5" fill="url(#art1)"/>
    <rect x="90" y="238" width="150" height="14" fill="#d1d5db"/>
    <rect x="152" y="260" width="26" height="46" fill="#cbd5e1"/>
    <rect x="122" y="306" width="86" height="9" rx="4" fill="#e2e8f0"/>
  </g>
  <!-- iMac 2 -->
  <g>
    <rect x="315" y="95" width="170" height="150" rx="10" fill="#e5e7eb"/>
    <rect x="325" y="105" width="150" height="118" rx="5" fill="url(#art2)"/>
    <rect x="325" y="223" width="150" height="14" fill="#d1d5db"/>
    <rect x="387" y="245" width="26" height="61" fill="#cbd5e1"/>
    <rect x="357" y="306" width="86" height="9" rx="4" fill="#e2e8f0"/>
  </g>
  <!-- iMac 3 -->
  <g>
    <rect x="550" y="110" width="170" height="150" rx="10" fill="#e5e7eb"/>
    <rect x="560" y="120" width="150" height="118" rx="5" fill="url(#art3)"/>
